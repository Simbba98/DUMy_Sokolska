<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Výukové materiály DUM</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- PapaParse pro načítání CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <header class="glass-header">
        <div class="header-content">
            <h1>Materiály DUM</h1>
            <nav id="navbar">
                <!-- Dynamically populated categories -->
            </nav>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Hledat v názvech souborů...">
            </div>
        </div>
    </header>

    <main class="container">
        <div id="loader" class="loader">Načítám data z tabulky...</div>
        <div id="content" class="hidden">
            <!-- Dynamically populated content -->
        </div>

        <section id="ostatni-soubory" class="category-section hidden">
            <h2 class="category-title">Ostatní soubory</h2>
            <div class="cards-grid" id="ostatni-grid">
                <!-- Fallback or dynamic items here -->
            </div>
        </section>
    </main>

    <footer class="glass-footer">
        <h2>Přidat nový odkaz</h2>
        <div class="iframe-container">
            <!-- Příklad placeholder iframe pro Google form. Pokud uživatel nedodal URL, je zde zástupná. -->
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe6ltPuCF238QgkEJuDXcMuU3PmOZw51qNlx06xUNaI9Wnxkg/viewform?usp=dialog" width="100%" height="800" frameborder="0" marginheight="0" marginwidth="0">Načítání…</iframe>
        </div>
        <p class="footer-text">© 2026 Výukové materiály DUM</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
